pre-commit:
  jobs:
    - name: Lint JS/TS with Biome
      glob: "**/*.{ts,js,jsx,tsx,cjs,mjs}"
      exclude:
        - "frontend/src/components/starwind/**"
        - "packages/**"
      run: pnpm typecheck {staged_files}
    - name: Lint and format Python with Ruff
      root: packages
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
commit-msg:
  jobs:
    - name: Validate commit-msg with commitlint
      run: pnpm exec commitlint --edit $1
