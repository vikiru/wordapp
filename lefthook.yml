pre-commit:
  parallel: true
  jobs:
    - name: "Format .astro with Prettier"
      glob: "frontend/**/*.astro"
      run: "pnpm prettier --write {staged_files}"
    - name: "Lint & Format TS/JS with oxlint"
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      exclude:
        - "frontend/src/components/starwind/**"
        - "frontend/src/lib/utils/starwind/**"
      run: "pnpm oxlint --fix {staged_files}"
    - name: "Format JSON/YAML/MD/CSS with Prettier"
      glob: "**/*.{json,yaml,yml,md,css}"
      exclude:
        - "node_modules/**"
        - "dist/**"
        - ".astro/**"
        - "packages/**"
        - "frontend/src/components/starwind/**"
        - "frontend/src/lib/utils/starwind/**"
      run: "pnpm prettier --write {staged_files}"
    - name: "Lint & Format Python with Ruff"
      root: packages
      glob: "**/*.py"
      run: "uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}"

commit-msg:
  jobs:
    - name: "Validate commit message"
      run: "pnpm exec commitlint --edit $1"