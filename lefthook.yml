pre-commit:
  parallel: false
  jobs:
    - name: Format Astro files
      glob: 'frontend/**/*.astro'
      run: 'pnpm prettier --write {staged_files}'
      stage_fixed: true

    - name: Format frontend source files
      glob: 'frontend/**/*.{ts,tsx,js,jsx,mjs,cjs}'
      exclude:
        - 'frontend/src/components/starwind/**'
        - 'frontend/src/lib/utils/starwind/**'
      run: 'pnpm oxfmt --write --ignore-path .gitignore {staged_files}'
      stage_fixed: true

    - name: Format frontend CSS and JSON
      glob: 'frontend/**/*.{css,json,jsonc}'
      exclude:
        - 'frontend/node_modules/**'
        - 'frontend/dist/**'
        - 'frontend/.astro/**'
        - 'frontend/src/data/**'
      run: 'pnpm biome format --write {staged_files}'
      stage_fixed: true

    - name: Format Python files
      root: packages
      glob: '**/*.py'
      run: 'uv run ruff format {staged_files}'
      stage_fixed: true

    - name: Validate frontend files
      glob: 'frontend/**/*.{ts,tsx,js,jsx,mjs,cjs,astro,css,json,jsonc}'
      exclude:
        - 'frontend/src/components/starwind/**'
        - 'frontend/src/lib/utils/starwind/**'
        - 'frontend/src/data/**'
      run: 'pnpm lint'

    - name: Validate Python files
      root: packages
      glob: '**/*.py'
      run: 'uv run ruff check {staged_files}'

commit-msg:
  jobs:
    - name: Validate commit message
      run: 'pnpm exec commitlint --edit $1'

pre-push:
  parallel: false
  jobs:
    - name: Frontend type and Astro verification
      glob: 'frontend/**/*.{ts,tsx,js,jsx,mjs,cjs,astro}'
      run: 'pnpm typecheck && pnpm lint:astro'

    - name: Python type verification
      root: packages
      glob: '**/*.py'
      run: 'uv run pyrefly check && uv run ty check'
