name: Generate Words
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (MM/DD/YYYY, default: today)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * *' # midnight UTC daily

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    defaults:
      run:
        working-directory: packages
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: false

      - name: Install deps (selective)
        run: uv sync --all-packages --no-install-package curate

      - name: Generate with Gemini
        run: uv run --no-sync python -m generate.main

      - name: Upload to MongoDB
        run: uv run --no-sync python -m data.upload

      - name: Check for staged changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated files (only if changes exist)
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate new words $(date -u +%Y-%m-%d)" || true
          git push
