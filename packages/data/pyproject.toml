[project]
name = "data"
version = "0.1.0"

requires-python = ">=3.13"
dependencies = ["config", "generate", "beanie>=2.1.0", "orjson", "pydantic>=2.13.4", "pydantic-settings>=2.10"]

[project.scripts]
data-upload = "data.upload:_async_main"
data-export = "data.export:_async_main"
data-archive = "data.archive:_async_main"
data-reset = "data.reset:_async_main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
config = { workspace = true }
generate = { workspace = true }

[tool.poe.tasks]
typecheck = { shell = "uv sync --all-packages && python -m pyrefly check", cwd = ".." }
format = "ruff format ."
lint = "ruff check --fix ."
save-to-db = "python -m data.upload"
fetch = "python -m data.export"
archive = "python -m data.archive"
reset = "uv run data-reset"
