[project]
name = "generate"
version = "0.1.0"
description = "Daily Gemini enrichment of curated vocabulary words"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "config",
    "google-genai>=2.16.0",
    "loguru>=0.7.3",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
]

[project.scripts]
generate = "generate.main:main"
generate-clean = "generate.clean:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["generate*"]

[tool.uv]
package = true

[tool.uv.sources]
generate = { path = "src/generate", editable = true }
config = { workspace = true }

[tool.poe.tasks]
typecheck = { shell = "uv sync --all-packages && python -m pyrefly check", cwd = ".." }
format = "ruff format ."
lint = "ruff check --fix ."
generate = "python -m generate.main $POE_EXTRA_ARGS"
clean = "uv run generate-clean"